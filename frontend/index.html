<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agentic RAG &amp; Knowledge Systems</title>
  <script>
    // Apply the persisted theme before first paint to avoid a flash of the
    // wrong color scheme (FOUC). Runs inline and synchronously; no external deps.
    (function () {
      var stored = null;
      try {
        stored = localStorage.getItem("theme");
      } catch (_) {
        stored = null;
      }
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      var theme = stored === "light" || stored === "dark"
        ? stored
        : prefersDark
          ? "dark"
          : "light";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Agentic RAG &amp; Knowledge Systems</h1>
    <div class="topbar-actions">
      <button
        id="theme-toggle"
        class="btn ghost"
        type="button"
        aria-label="Toggle color theme"
        title="Toggle color theme"
      >
        <svg class="theme-icon theme-icon-dark" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <circle cx="12" cy="12" r="4" fill="currentColor" />
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <svg class="theme-icon theme-icon-light" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M20.2 14.4A8.5 8.5 0 0 1 9.6 3.8a8.5 8.5 0 1 0 10.6 10.6Z" fill="currentColor" />
        </svg>
      </button>
      <span id="auth-status" class="badge">signed out</span>
    </div>
  </header>

  <main class="layout">
    <section id="login-panel" class="card">
      <h2>Sign in</h2>
      <form id="login-form">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit">Sign in</button>
      </form>
      <p id="login-error" class="error" hidden></p>
    </section>

    <section id="chat-panel" class="card" hidden>
      <h2>Ask a question</h2>
      <div id="messages" class="messages"></div>
      <form id="chat-form">
        <textarea
          id="question"
          rows="2"
          placeholder="Ask about LangGraph, Self-RAG, HITL... (Enter to send, Shift+Enter for a new line)"
          required
        ></textarea>
        <button type="submit">Send</button>
      </form>
    </section>

    <section id="dashboard-panel" class="card" hidden>
      <h2>Dashboard</h2>
      <p class="muted small">This session only — a fresh visit always starts at zero.</p>
      <div id="summary" class="summary"></div>
      <h3>Quality (Evaluation Driven Development)</h3>
      <div id="quality" class="summary"></div>
      <h3>Recent requests</h3>
      <div class="table-wrap">
        <table id="recent-table" class="recent">
          <thead>
            <tr>
              <th>Time</th><th>Tokens</th><th>Cost</th><th>Latency</th><th>Status</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="review-modal">
    <h2>Human review required</h2>
    <p id="review-question" class="muted"></p>
    <p id="review-docs" class="muted small"></p>
    <div class="review-actions">
      <button id="review-approve">Approve &amp; answer</button>
      <button id="review-retry">Retry with revised question</button>
      <button id="review-override">Override answer</button>
    </div>
    <textarea id="review-input" rows="3" placeholder="Revised question or manual answer" hidden></textarea>
    <div class="review-actions" id="review-confirm-row" hidden>
      <button id="review-confirm">Confirm</button>
      <button id="review-cancel">Cancel</button>
    </div>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
