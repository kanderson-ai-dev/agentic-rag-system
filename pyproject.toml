[project]
name = "agentic-rag-system"
version = "0.1.0"
description = "Agentic RAG & Knowledge Systems - a Self-RAG microservice built with FastAPI and LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.0,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "langgraph>=1.2.0,<2.0.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langchain>=1.3.0,<2.0.0",
    "langchain-core>=1.6.0,<2.0.0",
    "langchain-openai>=1.6.0,<2.0.0",
    "langsmith>=0.3.13,<1.0.0",
    "langchain-pinecone>=0.2.13",
    "langchain-chroma>=1.1.0",
    "neo4j>=6.3.1",
    "networkx>=3.6.1",
    "pyjwt>=2.14.0",
    "bcrypt>=5.0.0",
    "slowapi>=0.1.10",
    "structlog>=26.1.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "ruff>=0.8.0,<1.0.0",
    "mypy>=2.3.1",
    "pytest-cov>=7.1.0",
    "pip-audit>=2.10.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# LangGraph/LangChain use dynamic typing that conflicts with a few strict
# checks; these are disabled rather than sprinkling `# type: ignore` everywhere.
disable_error_code = ["arg-type", "call-overload", "import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "evaluation"]
