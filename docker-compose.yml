services:
  agentic-rag-system:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - rag-data:/app/data
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j-data:/data
    profiles:
      - graph

volumes:
  rag-data:
  neo4j-data:
